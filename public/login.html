<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Staff Login</title>
  <style>
/* ================================
   GYM DASHBOARD LOGIN
   MOBILE FIRST
   ================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

  font-family: Arial, Helvetica, sans-serif;

  background:
    radial-gradient(circle at top left, #374151 0%, transparent 35%),
    linear-gradient(135deg, #0f172a, #111827 55%, #020617);

  color: #111827;
}

/* Login card */

body > h1,
body > input,
body > button,
body > #message {
  width: 100%;
  max-width: 420px;
}

body {
  flex-direction: column;
}

/* Title */

body > h1 {
  color: #ffffff;
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 28px;
  letter-spacing: -0.5px;
}

/* Inputs */

input {
  width: 100%;
  max-width: 420px;

  padding: 15px 16px;
  margin-bottom: 14px;

  border: 1px solid #374151;
  border-radius: 12px;

  background: #ffffff;
  color: #111827;

  font-size: 16px;
  outline: none;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.2s ease;
}

input::placeholder {
  color: #9ca3af;
}

input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
}

/* Login button */

button {
  width: 100%;
  max-width: 420px;

  padding: 15px;
  margin-top: 6px;

  border: none;
  border-radius: 12px;

  background: #6366f1;
  color: #ffffff;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

button:hover {
  background: #4f46e5;
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
}

button:active {
  transform: scale(0.98);
}

/* Login message */

#message {
  width: 100%;
  max-width: 420px;

  margin-top: 16px;

  color: #e5e7eb;
  text-align: center;

  font-size: 14px;
  line-height: 1.5;
}

/* Mobile spacing */

@media (max-width: 480px) {
  body {
    padding: 24px 18px;
  }

  body > h1 {
    font-size: 28px;
    margin-bottom: 24px;
  }

  input,
  button {
    font-size: 16px;
  }
}

/* Tablet / desktop */

@media (min-width: 600px) {
  body {
    padding: 40px;
  }

  body > h1 {
    font-size: 34px;
  }

  input,
  button {
    padding: 16px;
  }
}
  </style>
</head>
<body>
  <h1>Gym Staff Login</h1>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

  <button id="loginButton">
    Login
  </button>
  <div id="message"></div>
  <script>
    const loginButton =
      document.getElementById("loginButton");
    const message =
      document.getElementById("message");
    loginButton.addEventListener("click", async () => {
      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;
      if (!email || !password) {
        message.textContent =
          "Please enter your email and password.";
        return;
      }
      message.textContent = "Logging in...";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });
        const text = await response.text();
        console.log("Login status:", response.status);
        console.log("Login response:", text);
        if (!text) {
          message.textContent =
            "The server returned an empty response.";
          return;
        }
        const result = JSON.parse(text);
        if (!response.ok) {
          message.textContent =
            result.error || "Login failed.";
          return;
        }
        localStorage.setItem(
          "accessToken",
          result.accessToken
        );
        message.textContent =
          "Login successful!";
        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 500);
      } catch (error) {
        console.error("Login error:", error);
        message.textContent =
          "Something went wrong during login.";
      }
    });
  </script>
</body>
</html>
