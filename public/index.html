<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Dashboard</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
  padding: 16px;
}

/* Main title */
body > h1 {
  max-width: 1100px;
  margin: 0 auto 20px;
  padding: 20px;
  background: #111827;
  color: white;
  border-radius: 16px;
  font-size: 26px;
}

/* Add member card */
.form {
  max-width: 1100px;
  margin: 0 auto 25px;
  padding: 20px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
}

.form h2 {
  margin-bottom: 18px;
  font-size: 21px;
}

/* Inputs */
input,
select {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;

  border: 1px solid #d1d5db;
  border-radius: 10px;

  background: white;
  color: #1f2937;

  font-size: 16px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #111827;
  box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
}

/* Membership label */
label {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  font-weight: 600;
}

/* Buttons */
button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;

  background: #111827;
  color: white;

  font-size: 15px;
  font-weight: 600;

  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform: scale(0.97);
}

/* Add member button */
.form button {
  width: 100%;
  margin-top: 5px;
}

/* Members heading */
body > h2 {
  max-width: 1100px;
  margin: 0 auto 12px;
  font-size: 21px;
}

/* Table container */
table {
  display: block;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;

  overflow-x: auto;
  background: white;

  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);

  border-collapse: collapse;
}

/* Keep table wide enough to scroll on phones */
thead,
tbody {
  width: 100%;
}

table {
  min-width: 750px;
}

th,
td {
  padding: 14px;
  text-align: left;
  border-bottom: 1px solid #e5e7eb;
  white-space: nowrap;
}

th {
  background: #f9fafb;
  color: #6b7280;
  font-size: 12px;
  text-transform: uppercase;
}

td {
  font-size: 14px;
}

/* Status */
td.active,
td.expiring,
td.expired {
  font-weight: 700;
}

/* Active */
td.active {
  color: #15803d;
}

/* Expiring */
td.expiring {
  color: #b45309;
}

/* Expired */
td.expired {
  color: #dc2626;
}

/* Delete button */
td button {
  background: #dc2626;
  padding: 8px 12px;
  font-size: 13px;
}

/* Tablet */
@media (min-width: 600px) {
  body {
    padding: 25px;
  }

  body > h1 {
    font-size: 30px;
    padding: 24px;
  }

  .form {
    padding: 25px;
  }
}

/* Desktop */
@media (min-width: 900px) {
  body {
    padding: 40px;
  }

  body > h1 {
    font-size: 32px;
  }

  .form {
    padding: 30px;
  }
}
  </style>
</head>
<body>
  <h1>Gym Dashboard</h1>
  <div class="form">
    <h2>Add Member</h2>
<input id="firstName" placeholder="First name">
<input id="lastName" placeholder="Last name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<br><br>
<label>
  Membership:
  <select id="membershipMonths">
    <option value="1">1 month</option>
    <option value="2">2 months</option>
    <option value="3">3 months</option>
    <option value="6">6 months</option>
    <option value="12">12 months</option>
  </select>
</label>
<br><br>
<button onclick="addMember()">Add Member</button>
  </div>
  <h2>Members</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Expiry</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
<tbody id="membersTable">
</tbody>
  </table>
  <script>
    const token = localStorage.getItem("accessToken");
    async function loadMembers() {
      const response = await fetch("/api/members", {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      const members = await response.json();
      const table = document.getElementById("membersTable");
      table.innerHTML = "";
      members.forEach(member => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${member.first_name} ${member.last_name}</td>
          <td>${member.email}</td>
          <td>${member.phone}</td>
          <td>${member.expiry_date}</td>
          <td class="${member.status.toLowerCase()}">
            ${member.status}
          </td>
          <td>
            <button onclick="deleteMember(${member.id})">
              Delete
            </button>
          </td>
        `;
        table.appendChild(row);
      });
    }
    async function addMember() {
      const firstName =
        document.getElementById("firstName").value;
      const lastName =
        document.getElementById("lastName").value;
      const email =
        document.getElementById("email").value;
      const phone =
        document.getElementById("phone").value;
      const membershipMonths =
        document.getElementById("membershipMonths").value;
      const response = await fetch("/api/members", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          firstName,
          lastName,
          email,
          phone,
          membershipMonths
        })
      });
      const result = await response.json();
      if (!response.ok) {
        alert(result.error);
        return;
      }
      alert("Member added successfully!");
      document.getElementById("firstName").value = "";
      document.getElementById("lastName").value = "";
      document.getElementById("email").value = "";
      document.getElementById("phone").value = "";
      loadMembers();
    }
    async function deleteMember(id) {
      const confirmed =
        confirm("Are you sure you want to delete this member?");
      if (!confirmed) {
        return;
      }
      const response = await fetch(`/api/members/${id}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      const result = await response.json();
      if (!response.ok) {
        alert(result.error);
        return;
      }
      alert("Member deleted.");
      loadMembers();
    }
    loadMembers();
  </script>
</body>
</html>
